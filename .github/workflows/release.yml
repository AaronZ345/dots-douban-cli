name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check tag version
        run: node -e 'if(process.env.GITHUB_REF_NAME!=="v"+require("./package.json").version)process.exit(1)'
      - run: npm run verify
      - run: npm run test:mcp
      - name: Create package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p user/release
          npm pack --ignore-scripts --pack-destination user/release
          sha256sum user/release/*.tgz > user/release/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" user/release/*.tgz user/release/SHA256SUMS --verify-tag --notes-file CHANGELOG.md
